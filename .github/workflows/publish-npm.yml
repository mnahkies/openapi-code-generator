name: Publish NPM
on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  publish_npm:
    name: publish_npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required to publish using trusted publishing
    environment: prod
    concurrency:
      group: publish-npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: 26.7.0
          package-manager-cache: false

      - name: Validate tag matches package.json versions
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          node scripts/validate-package-version.mjs "${TAG_VERSION}"

      - run: pnpm ci

      - run: pnpm run build

      - name: Publish packages
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |

          if [[ $TAG_VERSION == *"alpha"* ]]; then
            NPM_DIST_TAG=alpha
          else
            NPM_DIST_TAG=latest
          fi

          pnpm stage publish -r --tag $NPM_DIST_TAG
