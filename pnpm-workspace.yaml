catalog:
  '@angular/build': ^22.0.7
  '@angular/cli': ^22.0.7
  '@angular/common': ^22.0.7
  '@angular/compiler': ^22.0.7
  '@angular/compiler-cli': ^22.0.7
  '@angular/core': ^22.0.7
  '@angular/forms': ^22.0.7
  '@angular/platform-browser': ^22.0.7
  '@angular/router': ^22.0.7
  '@arethetypeswrong/core': ^0.18.5
  '@azure-tools/typespec-autorest': 0.70.0
  '@azure-tools/typespec-azure-core': 0.70.0
  '@azure-tools/typespec-azure-resource-manager': 0.70.0
  '@azure-tools/typespec-client-generator-core': 0.70.0
  '@biomejs/biome': 2.5.4
  '@biomejs/js-api': 6.0.0
  '@biomejs/wasm-nodejs': 2.5.4
  '@commander-js/extra-typings': ^15.0.0
  '@hyperjump/json-schema': ^1.17.7
  '@koa/router': ^15.7.0
  '@lerna-lite/cli': ^5.4.1
  '@lerna-lite/publish': ^5.4.1
  '@lerna-lite/version': ^5.4.1
  '@types/node': ^22.20.0
  '@types/react': ^19.2.17
  '@vitest/coverage-v8': 4.1.10
  axios: ^1.18.1
  body-parser: ^2.3.0
  commander: ^15.0.0
  conventional-changelog-conventionalcommits: ^10.2.1
  joi: ^18.2.3
  js-yaml: ^5.2.1
  lint-staged: ^17.0.7
  next: ^16.2.11
  prettier: ^3.9.5
  react: 19.2.7
  react-dom: 19.2.7
  react-hook-form: ^7.82.0
  tsdown: ^0.22.9
  tsx: ^4.23.1
  vitest: ^4.1.10

catalogs:
  typescript6:
    typescript: ^6.0.3
  typescript7:
    typescript: ^7.0.2

catalogMode: strict

packages:
  - packages/*
  - integration-tests/*
  - e2e

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

dedupeInjectedDeps: true

gitChecks: false

linkWorkspacePackages: deep

minimumReleaseAge: 10080
minimumReleaseAgeExclude: [ fast-uri@3.1.4, tar@7.5.21, '@next/env@16.2.11', '@next/swc-darwin-arm64@16.2.11', '@next/swc-darwin-x64@16.2.11', '@next/swc-linux-arm64-gnu@16.2.11', '@next/swc-linux-arm64-musl@16.2.11', '@next/swc-linux-x64-gnu@16.2.11', '@next/swc-linux-x64-musl@16.2.11', '@next/swc-win32-arm64-msvc@16.2.11', '@next/swc-win32-x64-msvc@16.2.11', next@16.2.11, brace-expansion@5.0.8 ]

nodeOptions: ${NODE_OPTIONS:- } --experimental-vm-modules

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    typescript: ^6
    zod: ^4

overrides:
  '@isaacs/brace-expansion': ^5.0.1
  '@types/node': 'catalog:'
  axios: ^1.18.1
  brace-expansion@^5: ^5.0.8
  'lodash-es@~4.17': ^4.18.0
  dompurify@^3: ^3.4.12
  postcss@^8: ^8.5.18
  qs: ^6.14.2
  sharp: 0.35.0
  tar: ^7.5.21
  zod: ^4.4.3
  fast-uri@^3: ^3.1.4

preferWorkspacePackages: true

publicHoistPattern:
  - '@typespec/*'
  - '@azure-tools/*'
  - '@types/node'
  - '@biomejs/biome'

patchedDependencies:
  nextra-theme-docs: patches/nextra-theme-docs.patch
