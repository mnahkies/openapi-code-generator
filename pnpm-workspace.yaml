catalog:
  '@angular/build': ^22.1.3
  '@angular/cli': ^22.1.3
  '@angular/common': ^22.1.1
  '@angular/compiler': ^22.1.1
  '@angular/compiler-cli': ^22.1.1
  '@angular/core': ^22.1.1
  '@angular/forms': ^22.1.1
  '@angular/platform-browser': ^22.1.1
  '@angular/router': ^22.1.1
  '@arethetypeswrong/core': ^0.18.5
  '@azure-tools/typespec-autorest': 0.71.0
  '@azure-tools/typespec-azure-core': 0.71.0
  '@azure-tools/typespec-azure-resource-manager': 0.71.0
  '@azure-tools/typespec-client-generator-core': 0.71.2
  '@biomejs/biome': 2.5.10
  '@biomejs/js-api': 6.0.0
  '@biomejs/wasm-nodejs': 2.5.10
  '@commander-js/extra-typings': ^15.0.0
  '@hookform/resolvers': ^5.7.1
  '@hyperjump/json-schema': ^1.17.8
  '@koa/router': ^15.7.0
  '@lerna-lite/cli': ^5.6.1
  '@lerna-lite/publish': ^5.6.1
  '@lerna-lite/version': ^5.6.1
  '@types/lodash': ^4.17.25
  '@types/node': ^22.20.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@typespec/events': 0.85.0
  '@typespec/rest': 0.85.0
  '@typespec/sse': 0.85.0
  '@typespec/streams': 0.85.0
  '@typespec/versioning': 0.85.0
  '@typespec/xml': 0.85.0
  '@vitest/coverage-v8': 4.1.11
  axios: ^1.19.0
  body-parser: ^2.3.0
  commander: ^15.0.0
  conventional-changelog-conventionalcommits: ^10.4.0
  joi: ^18.2.3
  js-yaml: ^5.2.3
  jsdom: ^30.0.1
  lint-staged: ^17.0.7
  monaco-editor: ^0.56.0
  next: ^16.3.0
  prettier: ^3.9.6
  publint: ^0.3.24
  react: 19.2.8
  react-dom: 19.2.8
  react-hook-form: ^7.85.0
  tsdown: ^0.22.14
  tsx: ^4.23.12
  vitest: ^4.1.11

catalogs:
  typescript6:
    typescript: ^6.0.3
  typescript7:
    typescript: ^7.0.2

catalogMode: strict

packages:
  - packages/*
  - integration-tests/*
  - e2e

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

dedupeInjectedDeps: true

gitChecks: false

linkWorkspacePackages: deep

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  [
    fast-uri@3.1.4,
    tar@7.5.21,
    '@next/env@16.2.11',
    '@next/swc-darwin-arm64@16.2.11',
    '@next/swc-darwin-x64@16.2.11',
    '@next/swc-linux-arm64-gnu@16.2.11',
    '@next/swc-linux-arm64-musl@16.2.11',
    '@next/swc-linux-x64-gnu@16.2.11',
    '@next/swc-linux-x64-musl@16.2.11',
    '@next/swc-win32-arm64-msvc@16.2.11',
    '@next/swc-win32-x64-msvc@16.2.11',
    next@16.2.11,
    brace-expansion@5.0.8,
    '@hyperjump/json-schema-errors@1.0.0-alpha.1',
    # Renovate security update: sharp@0.35.4
    sharp@0.35.4
  ]

nodeOptions: ${NODE_OPTIONS:- } --experimental-vm-modules

strictPeerDependencies: true

peerDependencyRules:
  allowedVersions:
    listr2: ^10.2.1
    typescript: ^6
    zod: ^4

overrides:
  '@isaacs/brace-expansion': ^5.0.1
  '@types/node': 'catalog:'
  axios: ^1.18.1
  brace-expansion@^5: ^5.0.8
  'lodash-es@~4.17': ^4.18.0
  dompurify@^3: ^3.4.12
  postcss@^8: ^8.5.18
  qs: ^6.14.2
  sharp: 0.35.4
  tar: ^7.5.21
  zod: ^4.4.3
  fast-uri@^3: ^3.1.4

preferWorkspacePackages: true

publicHoistPattern:
  - '@typespec/*'
  - '@azure-tools/*'
  - '@types/node'
  - '@biomejs/biome'

patchedDependencies:
  nextra-theme-docs: patches/nextra-theme-docs.patch
