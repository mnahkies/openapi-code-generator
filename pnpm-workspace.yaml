  '@types/node': 'catalog:'
  axios: ^1.18.1
  'lodash-es@~4.17': ^4.18.0
  qs: ^6.14.2
  tar: ^7.5.11
  zod: ^4.4.3
  fast-uri@^3: ^3.1.1

preferWorkspacePackages: true

publicHoistPattern:
  - '@typespec/*'
  - '@azure-tools/*'
  - '@types/node'
  - '@biomejs/biome'

patchedDependencies:
  nextra-theme-docs: patches/nextra-theme-docs.patch
