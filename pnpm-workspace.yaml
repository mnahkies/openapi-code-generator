catalogs:
  typescript6:
    typescript: ^6.0.3
  typescript7:
    typescript: ^7.0.2

catalogMode: strict

packages:
  - packages/*
  - integration-tests/*
  - e2e

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

dedupeInjectedDeps: true

gitChecks: false

linkWorkspacePackages: deep

minimumReleaseAge: 10080
